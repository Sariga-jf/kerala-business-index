<!DOCTYPE html>
<html>
<head><title>Competitor Tracker Maps</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://leaflet.github.io/Leaflet.heat/dist/leaflet-heat.js"></script>
<style>
    body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; display: flex; height: 100vh; background: #f4f5f7; flex-direction: column; }
    .navbar { background: #1e293b; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
    .navbar a { color: #cbd5e1; text-decoration: none; margin-left: 20px; }
    #workspace { display: flex; flex-grow: 1; height: calc(100vh - 54px); }
    #sidebar { width: 340px; background: white; padding: 20px; box-shadow: 2px 0 10px rgba(0,0,0,0.1); z-index: 1000; display: flex; flex-direction: column; gap: 15px; }
    #map { flex-grow: 1; height: 100%; }
    select, button { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; }
    button { background: #3b82f6; color: white; border: none; cursor: pointer; font-weight: bold; }
    .card { background: #f8f9fa; border-left: 4px solid #ef4444; padding: 15px; border-radius: 4px; font-size: 14px; }
</style>
</head>
<body>
    <div class="navbar">
        <div style="font-size: 18px; font-weight: bold; color: white;">Live Market Penetration Tracker</div>
        <div><a href="/">Home</a><a href="/site-selection">Site Selection Index</a><a href="/competitor-tracker">Competitor Scraper</a><a href="/my-dashboard">My Financial Dashboard</a></div>
    </div>
    <div id="workspace">
        <div id="sidebar">
            <h3>Scrape Infrastructure Density</h3>
            <label>Target District Zone:</label>
            <select id="district-selector">
                <option value="thiruvananthapuram">Thiruvananthapuram</option>
                <option value="ernakulam">Ernakulam</option>
                <option value="malappuram">Malappuram</option>
                <option value="thrissur">Thrissur</option>
                <option value="kozhikode">Kozhikode</option>
            </select>
            <label>Competitor Category Profile:</label>
            <select id="category-selector">
                <option value="supermarket">Supermarkets & Malls</option>
                <option value="cafe">Cafes & Specialty Coffee Shops</option>
                <option value="apparel">Clothing & Retail Garments</option>
            </select>
            <button onclick="runScraperEngine()">Fetch Live Competitors</button>
            <div id="status" class="card">Select a district and trigger the scraping run mechanism.</div>
        </div>
        <div id="map"></div>
    </div>
<script>
    const map = L.map('map').setView([10.8505, 76.2711], 7);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);
    let markers = L.layerGroup().addTo(map);
    let heat = null;

    function runScraperEngine() {
        const dist = document.getElementById('district-selector').value;
        const cat = document.getElementById('category-selector').value;
        document.getElementById('status').innerHTML = "<b>Status:</b> Accessing OpenStreetMap cluster vectors live...";
        
        fetch(`/api/get_competitors?district=${dist}&category=${cat}`)
            .then(res => res.json())
            .then(data => {
                markers.clearLayers();
                if(heat) map.removeLayer(heat);
                document.getElementById('status').innerHTML = `<b>Scrape Confirmed:</b> Mapped ${data.competitors.length} business entities inside ${dist.toUpperCase()}.`;
                
                let points = [];
                data.competitors.forEach(p => {
                    points.push([p.lat, p.lon, 1]);
                    L.circleMarker([p.lat, p.lon], {radius:5, color:'#ef4444', fillColor:'#f87171', fillOpacity:0.9})
                     .bindTooltip(p.name).addTo(markers);
                });
                if(points.length > 0) {
                    heat = L.heatLayer(points, {radius:25, blur:15, maxZoom:13}).addTo(map);
                    map.flyToBounds(points.map(p => [p[0], p[1]]));
                }
            });
    }
</script>
</body>
</html>
